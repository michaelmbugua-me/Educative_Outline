<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>course-hub — Educative library</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b0d;
      --bg-2: #101013;
      --bg-3: #16161a;
      --bg-hover: #1d1d23;
      --bg-active: #232329;
      --line: #26262d;
      --line-2: #32323a;
      --ink: #ececea;
      --ink-2: #a2a2aa;
      --ink-3: #6a6a73;
      --accent: #3fd98c;
      --accent-ink: #07281a;
      --accent-bg: rgba(63, 217, 140, 0.10);
      --accent-line: rgba(63, 217, 140, 0.28);
      --good: #3fd98c;
      --good-bg: rgba(63, 217, 140, 0.08);
      --shadow-1: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.25);
      --radius: 6px;
      --t: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace;
      --sidebar-width: 320px;
      --topbar-height: 52px;
    }

    [data-theme="light"] {
      --bg: #f4f4f2;
      --bg-2: #ffffff;
      --bg-3: #ecece8;
      --bg-hover: #e9e9e5;
      --bg-active: #dfdfdb;
      --line: #dcdcd6;
      --line-2: #c7c7c1;
      --ink: #1a1a1c;
      --ink-2: #54545c;
      --ink-3: #87878f;
      --accent: #067a4e;
      --accent-ink: #ffffff;
      --accent-bg: rgba(6, 122, 78, 0.08);
      --accent-line: rgba(6, 122, 78, 0.22);
      --good: #067a4e;
      --good-bg: rgba(6, 122, 78, 0.08);
      --shadow-1: 0 1px 2px rgba(20,20,25,.06), 0 12px 32px rgba(20,20,25,.08);
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--accent-bg); }

    button { font-family: inherit; font-size: inherit; color: inherit; }

    .mono { font-family: var(--font-mono); }

    /* ─── Scrollbars ─── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

    /* ─── Layout ─── */
    .app { display: flex; height: 100%; }
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-2);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      transition: width var(--t), transform var(--t);
      z-index: 100;
      overflow: hidden;
    }
    .sidebar.collapsed { width: 0; min-width: 0; border-right: none; }
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ─── Sidebar header ─── */
    .sb-head {
      height: var(--topbar-height);
      padding: 0 12px 0 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .sb-mark {
      width: 26px; height: 26px;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-mono);
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      user-select: none;
    }
    .sb-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      font-family: var(--font-mono);
      color: var(--ink);
    }
    .sb-title .dot { color: var(--accent); }
    .sb-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--ink-3);
      cursor: pointer;
      padding: 5px;
      border-radius: var(--radius);
      display: flex;
      align-items: center; justify-content: center;
      transition: all var(--t);
      opacity: 0;
    }
    .sidebar:hover .sb-close { opacity: 1; }
    @media (hover: none) { .sb-close { opacity: 1; } }
    .sb-close:hover { color: var(--ink); background: var(--bg-hover); }

    /* ─── Search ─── */
    .sb-search { padding: 10px 12px; flex-shrink: 0; }
    .search-box { position: relative; }
    .search-box input {
      width: 100%;
      padding: 7px 40px 7px 30px;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      font-size: 12.5px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color var(--t), box-shadow var(--t);
    }
    .search-box input::placeholder { color: var(--ink-3); }
    .search-box input:focus {
      border-color: var(--accent-line);
      box-shadow: 0 0 0 3px var(--accent-bg);
      background: var(--bg-2);
    }
    .search-icon {
      position: absolute;
      left: 9px; top: 50%;
      transform: translateY(-50%);
      color: var(--ink-3);
      pointer-events: none;
    }
    .search-kbd {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      font-size: 9.5px;
      color: var(--ink-3);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      padding: 1px 5px;
      pointer-events: none;
      background: var(--bg-2);
    }
    .search-results {
      position: absolute;
      top: calc(100% + 5px);
      left: 0; right: 0;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      max-height: 320px;
      overflow-y: auto;
      z-index: 200;
      display: none;
      box-shadow: var(--shadow-1);
    }
    .search-results.active { display: block; }
    .search-result-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background var(--t);
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--bg-hover); }
    .sr-course {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-3);
      letter-spacing: 0.04em;
    }
    .sr-title { font-size: 12.5px; color: var(--ink); margin-top: 2px; }

    /* ─── Sidebar nav ─── */
    .sb-nav { flex: 1; overflow-y: auto; padding: 0 0 24px; }

    .nav-switch {
      position: sticky; top: 0; z-index: 2;
      display: flex; gap: 4px; padding: 10px 10px 9px;
      background: var(--bg-2); border-bottom: 1px solid var(--line);
    }
    .nav-chip {
      flex: 1; min-width: 0; padding: 6px 0 5px; border-radius: var(--radius);
      border: 1px solid var(--line); background: transparent; color: var(--ink-3);
      font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
      cursor: pointer; line-height: 1.25; transition: color var(--t), background var(--t), border-color var(--t);
    }
    .nav-chip:hover { color: var(--ink); background: var(--bg-hover); }
    .nav-chip .pct { display: block; font-size: 9px; font-weight: 400; color: var(--ink-3); }
    .nav-chip.active {
      color: var(--hue); border-color: color-mix(in srgb, var(--hue) 45%, transparent);
      background: color-mix(in srgb, var(--hue) 12%, transparent);
    }

    .nav-course { padding: 16px 16px 8px; }
    .nav-course-title {
      display: block; padding: 0; border: 0; background: none; color: var(--ink); text-align: left;
      font-size: 14.5px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; cursor: pointer;
    }
    .nav-course-title:hover { color: var(--accent); }
    .nav-course-meta { margin-top: 5px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
    .nav-bar { height: 3px; margin-top: 11px; border-radius: 2px; background: var(--bg-3); overflow: hidden; }
    .nav-bar > i { display: block; height: 100%; background: var(--hue, var(--accent)); transition: width .3s var(--ease); }

    .nav-group {
      padding: 16px 16px 4px; font-size: 10.5px; font-weight: 600; color: var(--ink-3);
      text-transform: capitalize; letter-spacing: 0.02em;
    }

    .nav-ch { margin: 1px 0; }
    .nav-ch-head {
      display: flex; align-items: baseline; gap: 9px; width: calc(100% - 12px); margin: 0 6px;
      padding: 7px 10px; border: 0; border-radius: var(--radius); background: none; color: var(--ink);
      text-align: left; cursor: pointer; font-size: 13px; font-weight: 500; line-height: 1.35;
      transition: background var(--t);
    }
    .nav-ch-head:hover { background: var(--bg-hover); }
    .nav-ch-head .n { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); width: 18px; flex-shrink: 0; }
    .nav-ch-head .t { flex: 1; min-width: 0; }
    .nav-ch-head .p { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); flex-shrink: 0; }
    .nav-ch.complete .nav-ch-head .p { color: var(--good); }
    .nav-ch-bar { height: 2px; margin: 0 16px 2px 43px; border-radius: 1px; background: var(--bg-3); overflow: hidden; }
    .nav-ch-bar > i { display: block; height: 100%; background: var(--good); }
    .nav-ch-items { display: none; padding-bottom: 6px; }
    .nav-ch.open > .nav-ch-items { display: block; }

    .nav-row { display: flex; align-items: stretch; margin: 0 6px; border-radius: var(--radius); transition: background var(--t); }
    .nav-row:hover { background: var(--bg-hover); }
    .nav-row.active { background: var(--accent-bg); }
    .nav-main {
      flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px; position: relative;
      padding: 6px 6px 6px 36px; border: 0; background: none; color: var(--ink-2); text-align: left; cursor: pointer;
      font-size: 12.5px; line-height: 1.38; border-radius: var(--radius);
    }
    .nav-row.active .nav-main { color: var(--accent); font-weight: 500; }
    .nav-row.done .nav-main { color: var(--ink-3); }
    .nav-main .mark {
      position: absolute; left: 17px; top: 8px; width: 11px; height: 11px; border-radius: 50%;
      border: 1.5px solid var(--line-2); box-sizing: border-box;
    }
    .nav-row.partial .mark { border-color: var(--good); background: linear-gradient(90deg, var(--good) 50%, transparent 50%); }
    .nav-row.done .mark { border-color: var(--good); background: var(--good); }
    .nav-row.done .mark::after {
      content: '✓'; position: absolute; inset: -1px 0 0 0; color: var(--bg-2);
      font-size: 8px; line-height: 11px; text-align: center; font-weight: 700;
    }
    .nav-main .ttl { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nav-diff { flex-shrink: 0; margin-top: 2px; padding: 1px 5px; border-radius: 3px; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; }
    .d-easy   { color: #2fb877; background: rgba(63, 217, 140, 0.12); }
    .d-medium { color: #c98a14; background: rgba(242, 177, 60, 0.14); }
    .d-hard   { color: #e0553d; background: rgba(255, 107, 79, 0.13); }
    .nav-min { flex-shrink: 0; margin-top: 2px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
    .nav-sol {
      flex: none; align-self: center; margin-right: 4px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 4px;
      background: none; color: var(--ink-3); cursor: pointer; font-family: var(--font-mono); font-size: 9.5px;
    }
    .nav-sol:hover { color: var(--ink); border-color: var(--line-2); }
    .nav-sol.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-bg); }
    .nav-sol.done::before { content: '✓ '; color: var(--good); }
    .nav-main:focus-visible, .nav-sol:focus-visible, .nav-ch-head:focus-visible, .nav-chip:focus-visible, .nav-course-title:focus-visible {
      outline: 2px solid var(--accent); outline-offset: -2px;
    }

    /* ─── Topbar ─── */
    .topbar {
      height: var(--topbar-height);
      background: var(--bg-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }
    .topbar-btn {
      background: none;
      border: none;
      color: var(--ink-2);
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius);
      display: flex;
      align-items: center; justify-content: center;
      transition: all var(--t);
    }
    .topbar-btn:hover { color: var(--ink); background: var(--bg-hover); }
    .topbar-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--ink-3);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .topbar-breadcrumb .crumb {
      white-space: nowrap;
      cursor: pointer;
      transition: color var(--t);
    }
    .topbar-breadcrumb .crumb:hover { color: var(--ink-2); }
    .breadcrumb-sep { color: var(--ink-3); font-size: 10px; }
    .breadcrumb-current {
      color: var(--ink);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-actions { display: flex; align-items: center; gap: 6px; }
    .topbar-progress {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      border: 1px solid var(--line);
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      background: var(--bg-3);
    }

    /* ─── Content ─── */
    .content-area {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .content-area iframe { width: 100%; height: 100%; border: none; }

    /* ─── Dashboard ─── */
    .dashboard {
      height: 100%;
      overflow-y: auto;
      padding: 56px clamp(24px, 6vw, 84px) 80px;
    }

    .dash-inner { max-width: 980px; margin: 0 auto; }

    .masthead { margin-bottom: 40px; }
    .masthead-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
    .masthead-eyebrow .accent { color: var(--accent); }
    .masthead h1 {
      font-size: clamp(30px, 4.5vw, 44px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.02;
      margin-bottom: 14px;
    }
    .masthead h1 .period { color: var(--accent); }
    .masthead-sub {
      font-size: 14px;
      color: var(--ink-2);
      max-width: 52ch;
      line-height: 1.55;
    }

    /* Overview strip — hairline metrics, no cards */
    .overview {
      display: flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg-2);
      overflow: hidden;
      margin-bottom: 40px;
    }
    .ov-item {
      flex: 1;
      padding: 16px 20px;
      min-width: 0;
    }
    .ov-item + .ov-item { border-left: 1px solid var(--line); }
    .ov-value {
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .ov-value .accent { color: var(--accent); }
    .ov-label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-3);
      margin-top: 4px;
    }

    /* Continue card */
    .continue {
      margin-bottom: 44px;
      display: none;
    }
    .continue.visible { display: block; }
    .cont-row {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
      gap: 14px;
      transition: border-color var(--t), transform var(--t), box-shadow var(--t);
    }
    .cont-row:hover {
      border-color: var(--accent-line);
      transform: translateY(-1px);
      box-shadow: var(--shadow-1);
    }
    .cont-kicker {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--good);
      background: var(--good-bg);
      border: 1px solid var(--accent-line);
      padding: 4px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .cont-body { flex: 1; min-width: 0; }
    .cont-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cont-course {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-3);
      margin-top: 3px;
    }
    .cont-arrow { color: var(--ink-3); font-size: 15px; transition: transform var(--t); flex-shrink: 0; }
    .cont-row:hover .cont-arrow { transform: translateX(3px); color: var(--accent); }

    /* Course index rows */
    /* ─── Today plan ─── */
    .today { margin: 0 0 40px; }
    .today-head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
    .today-head h2 { font-size:15px; font-weight:600; letter-spacing:-0.01em; }
    .today-head .goal { font-family:var(--font-mono); font-size:11px; color:var(--ink-3); display:flex; align-items:center; gap:6px; }
    .today-head input { width:56px; background:var(--bg-3); border:1px solid var(--line); color:var(--ink); border-radius:var(--radius); padding:3px 6px; font:inherit; font-family:var(--font-mono); }
    .today-bar { height:4px; background:var(--bg-3); border-radius:2px; overflow:hidden; margin-bottom:14px; }
    .today-bar > span { display:block; height:100%; background:var(--accent); transition:width .4s var(--ease); }
    .today-done { font-family:var(--font-mono); font-size:12px; color:var(--accent); padding:10px 0; }
    .today-item { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; margin-bottom:6px; cursor:pointer; transition:border-color var(--t), background var(--t); }
    .today-item:hover { border-color:var(--accent-line); background:var(--bg-hover); }
    .today-item .tag { font-family:var(--font-mono); font-size:10px; padding:2px 6px; border-radius:4px; color:var(--hue); background:color-mix(in srgb, var(--hue) 14%, transparent); flex-shrink:0; }
    .today-item .ttl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .today-item .sub { font-family:var(--font-mono); font-size:11px; color:var(--ink-3); flex-shrink:0; }

    /* ─── Lesson outline ─── */
    .outline { position:absolute; right:16px; bottom:64px; width:300px; max-height:60%; overflow:auto; display:none; z-index:60;
      background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--radius); box-shadow:var(--shadow-1); padding:6px; }
    .outline.open { display:block; }
    .outline-head { font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); padding:6px 8px; }
    .ol-item { display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink-2); padding:5px 8px; border-radius:4px; cursor:pointer; font-size:12.5px; line-height:1.35; }
    .ol-item:hover { background:var(--bg-hover); color:var(--ink); }
    .ol-h3 { padding-left:22px; font-size:12px; }
    .ol-empty { padding:8px; color:var(--ink-3); font-size:12px; }

    .index-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .index-label .rule { flex: 1; height: 1px; background: var(--line); }
    .index-label .txt {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .index { display: grid; gap: 8px; }
    .courserow {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      transition: border-color var(--t), transform var(--t), box-shadow var(--t);
    }
    .courserow::after {
      content: attr(data-n);
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-58%);
      font-family: var(--font-mono);
      font-size: clamp(64px, 9vw, 110px);
      font-weight: 700;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px var(--line);
      pointer-events: none;
      user-select: none;
      padding-right: 10px;
    }
    .courserow:hover {
      border-color: var(--line-2);
      transform: translateY(-1px);
      box-shadow: var(--shadow-1);
    }
    .courserow:hover::after { -webkit-text-stroke-color: var(--hue, var(--line-2)); }
    .cr-index {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-3);
      flex-shrink: 0;
      width: 30px;
    }
    .cr-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
    .cr-row-top { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
    .cr-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.04em;
      color: var(--hue, var(--ink-2));
      border: 1px solid color-mix(in srgb, var(--hue, #888) 30%, transparent);
      background: color-mix(in srgb, var(--hue, #888) 10%, transparent);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
      line-height: 1.2;
    }
    .cr-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cr-sub {
      font-size: 12.5px;
      color: var(--ink-2);
      position: relative;
      z-index: 1;
    }
    .cr-meta {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: flex-end;
      flex-shrink: 0;
      min-width: 148px;
      position: relative;
      z-index: 1;
    }
    .cr-nums {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .cr-nums .pct { color: var(--hue, var(--accent)); font-weight: 600; }
    .cr-track {
      width: 148px;
      height: 3px;
      background: var(--bg-3);
      border-radius: 2px;
      overflow: hidden;
    }
    .cr-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--hue, var(--accent));
      transition: width 0.5s var(--ease);
    }
    .cr-open {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity var(--t), transform var(--t), color var(--t);
      position: relative;
      z-index: 1;
    }
    .courserow:hover .cr-open { opacity: 1; transform: translateX(0); color: var(--accent); }

    /* Dashboard footer hints */
    .dash-foot {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-3);
      letter-spacing: 0.03em;
    }
    .dash-foot b { color: var(--ink-2); font-weight: 500; }

    /* ─── Welcome (course landing) ─── */
    .welcome {
      height: 100%;
      overflow-y: auto;
      padding: 60px clamp(24px, 6vw, 84px);
    }
    .welcome-inner { max-width: 640px; margin: 0 auto; }
    .welcome .masthead-eyebrow { margin-bottom: 12px; }
    .welcome h2 {
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 12px;
    }
    .welcome h2 .period { color: var(--accent); }
    .welcome p {
      font-size: 14px;
      color: var(--ink-2);
      max-width: 54ch;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .welcome .meta-row {
      display: flex;
      gap: 18px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 16px;
      background: var(--bg-2);
      margin-bottom: 28px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform var(--t), box-shadow var(--t);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-1); }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 16px;
      cursor: pointer;
      transition: all var(--t);
    }
    .btn-ghost:hover { color: var(--ink); border-color: var(--line-2); background: var(--bg-3); }
    .welcome-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .welcome-shortcuts {
      margin-top: 34px;
      display: flex;
      gap: 8px 18px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-3);
    }

    /* ─── Loading bar ─── */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      z-index: 50;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.35s;
      pointer-events: none;
    }
    .loading-overlay.hidden { opacity: 0; }
    .loading-overlay .bar {
      height: 100%;
      width: 40%;
      background: var(--accent);
    }
    @media (prefers-reduced-motion: no-preference) {
      .loading-overlay .bar { animation: loadbar 1.1s var(--ease) infinite; }
    }
    @keyframes loadbar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* ─── Lesson nav buttons ─── */
    .lesson-nav {
      position: absolute;
      bottom: 18px;
      right: 18px;
      display: flex;
      gap: 8px;
      z-index: 30;
    }
    .lesson-nav-btn {
      padding: 7px 13px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink-2);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all var(--t);
      box-shadow: var(--shadow-1);
    }
    .lesson-nav-btn:hover { background: var(--bg-hover); color: var(--ink); border-color: var(--line-2); }
    .lesson-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ─── Code panel ─── */
    .code-panel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 46%;
      min-width: 340px;
      background: var(--bg-2);
      border-left: 1px solid var(--line);
      z-index: 40;
      display: none;
      flex-direction: column;
    }
    .code-panel.open { display: flex; }
    .code-panel-header {
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-2);
      flex-shrink: 0;
    }
    .code-panel-header svg { color: var(--accent); }
    .code-panel-header button {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--ink-3);
      cursor: pointer;
      padding: 4px;
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      transition: all var(--t);
    }
    .code-panel-header button:hover { color: var(--ink); background: var(--bg-hover); }
    .code-tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .code-tab {
      padding: 8px 13px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      cursor: pointer;
      border-bottom: 1.5px solid transparent;
      white-space: nowrap;
      margin-bottom: -1px;
      transition: all var(--t);
    }
    .code-tab:hover { color: var(--ink-2); background: var(--bg-hover); }
    .code-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .code-content {
      flex: 1;
      overflow: auto;
      padding: 16px;
      background: var(--bg);
    }
    .code-content pre {
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ─── Entry motion ─── */
    .rise { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .rise {
        opacity: 0;
        animation: rise 0.6s var(--ease) forwards;
      }
      .rise-d0 { animation-delay: 0.02s; }
      .rise-d1 { animation-delay: 0.09s; }
      .rise-d2 { animation-delay: 0.16s; }
      .rise-d3 { animation-delay: 0.23s; }
      .rise-d4 { animation-delay: 0.30s; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Responsive ─── */
    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        transform: translateX(-100%);
        z-index: 200;
        box-shadow: var(--shadow-1);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar.collapsed { transform: translateX(-100%); }
      .dashboard { padding: 40px 20px 64px; }
      .welcome { padding: 40px 20px; }
      .overview { flex-wrap: wrap; border: none; background: transparent; gap: 8px; }
      .ov-item { flex: 1 1 calc(50% - 8px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); }
      .ov-item + .ov-item { border-left: 1px solid var(--line); }
      .courserow { flex-wrap: wrap; }
      .cr-meta { min-width: 100%; flex-direction: row; justify-content: space-between; align-items: center; }
      .code-panel { width: 100%; min-width: 0; }
      .lesson-nav { bottom: 12px; right: 12px; }
      .dash-foot { gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="sb-mark">⌘</div>
        <div class="sb-title">course-hub<span class="dot">/</span></div>
        <button class="sb-close" onclick="toggleSidebar()" title="Close sidebar">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="sb-search">
        <div class="search-box">
          <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search lessons…" autocomplete="off">
          <span class="search-kbd">⌘K</span>
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
      <nav class="sb-nav" id="sidebarNav"></nav>
    </aside>

    <!-- Main area -->
    <div class="main-area">
      <div class="topbar">
        <button class="topbar-btn" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle sidebar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="topbar-breadcrumb" id="breadcrumb">
          <span class="crumb" onclick="showDashboard()">Home</span>
        </div>
        <div class="topbar-actions">
          <span class="topbar-progress" id="progressBadge" style="display:none;"></span>
          <button class="topbar-btn" onclick="toggleTheme()" title="Toggle theme (⌘D)">
            <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>
          <button class="topbar-btn" onclick="toggleCodePanel()" title="Toggle code panel">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </button>
        </div>
      </div>

      <div class="content-area" id="contentArea">
        <div class="dashboard" id="dashboard"></div>
        <div class="welcome" id="welcome" style="display:none;"></div>
        <iframe id="lessonFrame" style="display:none;"></iframe>
        <div class="loading-overlay hidden" id="loading"><div class="bar"></div></div>

        <div class="code-panel" id="codePanel">
          <div class="code-panel-header">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span>Source Code</span>
            <button onclick="toggleCodePanel()">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
          </div>
          <div class="code-tabs" id="codeTabs"></div>
          <div class="code-content" id="codeContent"><pre id="codePre">Select a lesson with code…</pre></div>
        </div>

        <div class="outline" id="outline">
          <div class="outline-head">On this page</div>
          <div id="outlineList"></div>
        </div>

        <div class="lesson-nav" id="lessonNav" style="display:none;">
          <button class="lesson-nav-btn" id="outlineBtn" onclick="toggleOutline()" title="Outline (O)">☰ Outline</button>
          <button class="lesson-nav-btn" id="prevBtn" onclick="navigateLesson(-1)">← Prev</button>
          <button class="lesson-nav-btn" onclick="markComplete()">✓ Done</button>
          <button class="lesson-nav-btn" id="nextBtn" onclick="navigateLesson(1)">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ─── State ───
    let courses = [];
    let currentCourse = null;
    let currentLesson = null;
    let flatLessons = [];
    let currentIndex = -1;
    // Study state lives on the server (.data/state.json); see /api/state.
    let state = { completed: {}, lastOpened: {}, scroll: {}, settings: { dailyMinutes: 120, weights: { sd: 3, gci: 1 } } };
    let lastOpened = null;
    const DEFAULT_MINUTES = 10;   // for courses without a computed estimate

    const doneKey = (courseKey, path) => `${courseKey}:${path}`;
    const isDone = (courseKey, path) => !!state.completed[doneKey(courseKey, path)];
    const post = (url, body) => fetch(url, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
    }).catch(() => {});

    function latestOpened() {
      const all = Object.entries(state.lastOpened).map(([course, o]) => ({ course, ...o }));
      all.sort((a, b) => b.at - a.at);
      return all[0] || null;
    }

    async function loadState() {
      state = await (await fetch('/api/state')).json();
      // One-time import of progress that used to live in this browser's localStorage.
      try {
        const old = JSON.parse(localStorage.getItem('completedLessons') || '{}');
        if (Object.keys(old).length && !localStorage.getItem('progressImported')) {
          await post('/api/state/import', { completed: old });
          localStorage.setItem('progressImported', '1');
          state = await (await fetch('/api/state')).json();
        }
      } catch {}
      lastOpened = latestOpened();
    }

    const COURSE_TAGS = { blind75: 'B75', grind75: 'G75', lld: 'LLD', gci: 'GCI', sd: 'SD' };
    const COURSE_HUES = { blind75: '#ff6b4f', grind75: '#f2b13c', lld: '#54a8ff', gci: '#a78bfa', sd: '#f472b6' };

    // ─── Init ───
    async function init() {
      await loadState();
      const res = await fetch('/api/courses');
      courses = await res.json();
      renderDashboard();
      initNav();

      if (window.location.hash) {
        const parts = hashdecode(window.location.hash.slice(1));
        if (parts.course && parts.lesson) {
          const course = courses.find(c => c.key === parts.course);
          if (course) {
            selectCourse(course, false);
            setTimeout(() => {
              const lesson = flatLessons.find(l => l.path === parts.lesson);
              if (lesson) openLesson(lesson);
            }, 300);
          }
        }
      }
    }

    function hashdecode(s) {
      try { return JSON.parse(decodeURIComponent(s)); } catch { return {}; }
    }

    function courseTag(c) { return COURSE_TAGS[c.key] || c.tag || c.key.toUpperCase(); }
    function courseHue(c) { return COURSE_HUES[c.key] || c.color; }

    // ─── Dashboard ───
    function renderDashboard() {
      const totalLessons = courses.reduce((a, c) => a + c.totalLessons, 0);
      const completedCount = Object.keys(state.completed).length;
      const overallPct = totalLessons > 0 ? Math.round((completedCount / totalLessons) * 100) : 0;

      let html = '<div class="dash-inner">';

      html += `
        <header class="masthead rise rise-d0">
          <div class="masthead-eyebrow">~/<span class="accent">library</span> · ${String(courses.length).padStart(2,'0')} courses · ${totalLessons} lessons</div>
          <h1>The prep library<span class="period">.</span></h1>
          <p class="masthead-sub">${courses.length} courses in one console. Pick up wherever you left off, or jump straight into a pattern.</p>
        </header>

        <div class="overview rise rise-d1">
          <div class="ov-item">
            <div class="ov-value">${String(courses.length).padStart(2,'0')}</div>
            <div class="ov-label">courses</div>
          </div>
          <div class="ov-item">
            <div class="ov-value">${totalLessons}</div>
            <div class="ov-label">lessons</div>
          </div>
          <div class="ov-item">
            <div class="ov-value"><span class="accent">${completedCount}</span></div>
            <div class="ov-label">completed</div>
          </div>
          <div class="ov-item">
            <div class="ov-value">${String(overallPct).padStart(2,'0')}<span class="accent">%</span></div>
            <div class="ov-label">overall</div>
          </div>
        </div>
      `;

      // Continue where you left off
      if (lastOpened && lastOpened.course && lastOpened.path) {
        const contCourse = courses.find(c => c.key === lastOpened.course);
        if (contCourse) {
          html += `
            <section class="continue visible rise rise-d1">
              <button class="cont-row" style="--hue:${courseHue(contCourse)}"
                      onclick="resume('${contCourse.key}')">
                <span class="cont-kicker">Continue</span>
                <span class="cont-body">
                  <span class="cont-title">${lastOpened.title || 'Resume lesson'}</span>
                  <span class="cont-course">${contCourse.label} · lesson ${(lastOpened.index != null ? lastOpened.index + 1 : '?')}</span>
                </span>
                <span class="cont-arrow">→</span>
              </button>
            </section>
          `;
        }
      }

      html += renderToday();

      // Course index
      html += `
        <section class="rise rise-d${lastOpened ? 2 : 1}">
          <div class="index-label">
            <span class="txt">Library index</span>
            <span class="rule"></span>
          </div>
          <div class="index">
      `;

      courses.forEach((course, i) => {
        const lessons = flatLessonsForCourse(course);
        const done = lessons.filter(l => isDone(course.key, l.path)).length;
        const pct = course.totalLessons > 0 ? Math.round((done / course.totalLessons) * 100) : 0;

        html += `
          <button class="courserow" style="--hue:${courseHue(course)}" data-n="${String(i+1).padStart(2,'0')}"
                  onclick="selectCourse(courses.find(c=>c.key==='${course.key}'))">
            <span class="cr-index mono">0${i+1}</span>
            <span class="cr-body">
              <span class="cr-row-top">
                <span class="cr-tag mono">${courseTag(course)}</span>
                <span class="cr-title">${course.label}</span>
              </span>
              <span class="cr-sub">${course.subtitle}</span>
            </span>
            <span class="cr-meta">
              <span class="cr-nums">${done} / ${course.totalLessons} <span class="pct">${pct}%</span></span>
              <span class="cr-track"><span class="cr-fill" style="width:${pct}%"></span></span>
              <span class="cr-open">Open course →</span>
            </span>
          </button>
        `;
      });

      html += '</div></section>';

      html += `
        <footer class="dash-foot rise">
          <span><b>⌘K</b> Search</span>
          <span><b>⌘D</b> Theme</span>
          <span><b>⌘←</b> / <b>⌘→</b> Prev · Next</span>
          <span><b>⌘0</b> Mark done</span>
        </footer>
      `;

      html += '</div>';
      document.getElementById('dashboard').innerHTML = html;
    }

    function resume(courseKey) {
      const course = courses.find(c => c.key === courseKey);
      if (!course) return;
      selectCourse(course, false);
      const last = state.lastOpened[courseKey];
      setTimeout(() => {
        const lesson = (last && flatLessons.find(l => l.path === last.path)) || flatLessons.find(l => l.hasContent);
        if (lesson) openLesson(lesson);
      }, 100);
    }

    function flatLessonsForCourse(course) {
      const lessons = [];
      for (const section of course.sections) {
        for (const cat of section.categories) {
          for (const lesson of cat.lessons) {
            lessons.push({
              ...lesson,
              sectionName: section.name,
              categoryName: cat.name,
              courseKey: course.key,
              courseLabel: course.label,
              path: `${section.name !== 'Full Course' ? section.name + '/' : ''}${lesson.folderName}`
            });
          }
        }
      }
      return lessons;
    }

    // ─── Sidebar ───
    // One course at a time (switcher on top), chapters with progress, and problem + solution merged into one row.
    let navCourseKey = null;
    const openChapters = new Set();     // "<course>:<chapter index>"

    function escapeAttr(s) {
      return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function parseDifficulty(title) {
      const m = title.match(/\s*\((easy|medium|hard)\)\s*$/i);
      return m ? { title: title.slice(0, m.index), difficulty: m[1].toLowerCase() } : { title, difficulty: null };
    }

    const isSolutionTitle = t => /^solution\b/i.test(t);

    // Pair "X" with the "Solution: X" that follows it.
    function groupRows(lessons) {
      const rows = [];
      for (const l of lessons) {
        const prev = rows[rows.length - 1];
        if (isSolutionTitle(l.title) && prev && prev.lessons.length === 1 && !isSolutionTitle(prev.lessons[0].title)) {
          prev.lessons.push(l);
        } else {
          rows.push({ lessons: [l] });
        }
      }
      for (const r of rows) {
        const first = r.lessons[0];
        const base = isSolutionTitle(first.title) ? first.title.replace(/^solution\b[:\s]*/i, '') || first.title : first.title;
        const { title, difficulty } = parseDifficulty(base);
        r.title = title;
        r.difficulty = difficulty;
        r.minutes = r.lessons.reduce((a, l) => a + lessonMinutes(l), 0);
        r.doneCount = r.lessons.filter(l => isDone(l.courseKey, l.path)).length;
      }
      return rows;
    }

    function navChapters(course) {
      const chapters = [];
      for (const l of flatLessonsForCourse(course)) {
        if (!l.hasContent) continue;
        const last = chapters[chapters.length - 1];
        if (last && last.section === l.sectionName && last.name === l.categoryName) last.lessons.push(l);
        else chapters.push({ section: l.sectionName, name: l.categoryName, lessons: [l] });
      }
      chapters.forEach((c, i) => {
        c.index = i;
        c.rows = groupRows(c.lessons);
        c.rowsDone = c.rows.filter(r => r.doneCount === r.lessons.length).length;
        c.minutesLeft = c.lessons.filter(l => !isDone(l.courseKey, l.path)).reduce((a, l) => a + lessonMinutes(l), 0);
      });
      return chapters;
    }

    function courseStats(course) {
      const flat = flatLessonsForCourse(course).filter(l => l.hasContent);
      const done = flat.filter(l => isDone(course.key, l.path)).length;
      const left = flat.filter(l => !isDone(course.key, l.path)).reduce((a, l) => a + lessonMinutes(l), 0);
      return { total: flat.length, done, left, pct: flat.length ? Math.round(done / flat.length * 100) : 0 };
    }

    function fmtDuration(min) {
      if (min < 60) return `${min}m`;
      const h = min / 60;
      return `${h < 10 ? h.toFixed(1).replace(/\.0$/, '') : Math.round(h)}h`;
    }

    function initNav() {
      let key = null;
      try { key = localStorage.getItem('navCourse'); } catch {}
      if (!courses.some(c => c.key === key)) key = (lastOpened && lastOpened.course) || null;
      if (!courses.some(c => c.key === key)) key = (courses.find(c => c.key === 'sd') || courses[0]).key;
      navCourseKey = key;
      renderNav();
    }

    function setNavCourse(key) {
      if (!courses.some(c => c.key === key)) return;
      navCourseKey = key;
      try { localStorage.setItem('navCourse', key); } catch {}
      renderNav();
    }

    function renderNav(opts = {}) {
      const nav = document.getElementById('sidebarNav');
      const course = courses.find(c => c.key === navCourseKey);
      if (!course) { nav.innerHTML = ''; return; }
      const scroll = nav.scrollTop;
      const chapters = navChapters(course);

      // Default-open the chapter containing the active lesson, else the resume point, else the first unfinished.
      const activePath = currentLesson && currentLesson.courseKey === course.key ? currentLesson.path : null;
      const hasOpen = chapters.some(c => openChapters.has(`${course.key}:${c.index}`));
      if (activePath) {
        const ch = chapters.find(c => c.lessons.some(l => l.path === activePath));
        if (ch) openChapters.add(`${course.key}:${ch.index}`);
      } else if (!hasOpen) {
        const resume = state.lastOpened[course.key];
        const ch = (resume && chapters.find(c => c.lessons.some(l => l.path === resume.path)))
          || chapters.find(c => c.rowsDone < c.rows.length) || chapters[0];
        if (ch) openChapters.add(`${course.key}:${ch.index}`);
      }

      const hue = courseHue(course);
      const st = courseStats(course);
      let html = '<div class="nav-switch">';
      for (const c of courses) {
        const cs = courseStats(c);
        html += `<button class="nav-chip ${c.key === course.key ? 'active' : ''}" style="--hue:${courseHue(c)}"
                         data-act="switch" data-course="${c.key}" title="${escapeHtml(c.label)}">${courseTag(c)}<span class="pct">${cs.pct}%</span></button>`;
      }
      html += '</div>';

      html += `<div class="nav-course" style="--hue:${hue}">
        <button class="nav-course-title" data-act="home" data-course="${course.key}">${escapeHtml(course.label)}</button>
        <div class="nav-course-meta">${st.done}/${st.total} lessons · ${st.left ? '~' + fmtDuration(st.left) + ' left' : 'complete'}</div>
        <div class="nav-bar"><i style="width:${st.pct}%"></i></div>
      </div>`;

      let lastSection = null;
      for (const ch of chapters) {
        if (course.sections.length > 1 && ch.section !== lastSection) {
          html += `<div class="nav-group">${escapeHtml(ch.section)}</div>`;
          lastSection = ch.section;
        }
        const isOpen = openChapters.has(`${course.key}:${ch.index}`);
        const complete = ch.rows.length > 0 && ch.rowsDone === ch.rows.length;
        const pct = ch.rows.length ? Math.round(ch.rowsDone / ch.rows.length * 100) : 0;
        html += `<section class="nav-ch ${isOpen ? 'open' : ''} ${complete ? 'complete' : ''}" data-ch="${ch.index}">
          <button class="nav-ch-head" data-act="chapter" data-ch="${ch.index}" aria-expanded="${isOpen}">
            <span class="n">${String(ch.index + 1).padStart(2, '0')}</span>
            <span class="t">${escapeHtml(ch.name)}</span>
            <span class="p">${complete ? '✓' : `${ch.rowsDone}/${ch.rows.length}`}</span>
          </button>
          <div class="nav-ch-bar"><i style="width:${pct}%"></i></div>
          <div class="nav-ch-items">`;
        for (const r of ch.rows) {
          const first = r.lessons[0], second = r.lessons[1];
          const active = r.lessons.some(l => l.path === activePath);
          const state_ = r.doneCount === r.lessons.length ? 'done' : r.doneCount > 0 ? 'partial' : '';
          html += `<div class="nav-row ${active ? 'active' : ''} ${state_}">
            <button class="nav-main" data-act="open" data-course="${course.key}" data-path="${escapeHtml(first.path)}" title="${escapeHtml(first.title)}">
              <span class="mark"></span>
              <span class="ttl">${escapeHtml(r.title)}</span>
              ${r.difficulty ? `<span class="nav-diff d-${r.difficulty}">${r.difficulty}</span>` : ''}
              <span class="nav-min">${r.minutes}m</span>
            </button>
            ${second ? `<button class="nav-sol ${second.path === activePath ? 'on' : ''} ${isDone(course.key, second.path) ? 'done' : ''}"
                                data-act="open" data-course="${course.key}" data-path="${escapeHtml(second.path)}" title="${escapeHtml(second.title)}">Solution</button>` : ''}
          </div>`;
        }
        html += '</div></section>';
      }

      nav.innerHTML = html;
      nav.scrollTop = opts.reveal ? scroll : scroll;
      if (opts.reveal) {
        const el = nav.querySelector('.nav-row.active');
        if (el) el.scrollIntoView({ block: 'nearest' });
      }
    }

    document.getElementById('sidebarNav').addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'switch') {
        setNavCourse(el.dataset.course);
      } else if (act === 'home') {
        const c = courses.find(x => x.key === el.dataset.course);
        if (c) selectCourse(c);
      } else if (act === 'chapter') {
        const k = `${navCourseKey}:${el.dataset.ch}`;
        if (openChapters.has(k)) openChapters.delete(k); else openChapters.add(k);
        const sec = el.closest('.nav-ch');
        sec.classList.toggle('open', openChapters.has(k));
        el.setAttribute('aria-expanded', openChapters.has(k));
      } else if (act === 'open') {
        openLessonByPath(el.dataset.course, el.dataset.path);
      }
    });

    // ─── Course Selection ───
    function selectCourse(course, showWelcome = true) {
      currentCourse = course;
      flatLessons = flatLessonsForCourse(course);

      setNavCourse(course.key);

      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('lessonFrame').style.display = 'none';
      document.getElementById('lessonNav').style.display = 'none';
      document.getElementById('welcome').style.display = showWelcome ? 'block' : 'none';
      document.getElementById('codePanel').classList.remove('open');

      if (showWelcome) {
        const done = flatLessons.filter(l => isDone(l.courseKey, l.path)).length;
        const firstLesson = flatLessons.find(l => l.hasContent);
        document.getElementById('welcome').innerHTML = `
          <div class="welcome-inner">
            <div class="masthead-eyebrow rise rise-d0">~/<span class="accent">${course.key}</span> · ${course.totalLessons} lessons</div>
            <h2 class="rise rise-d1">${course.label}<span class="period">.</span></h2>
            <p class="rise rise-d1">${course.subtitle}. Work through the sections below or jump straight in.</p>
            <div class="meta-row rise rise-d2">
              <span>${course.totalLessons} lessons</span>
              <span>${done} complete</span>
              ${firstLesson ? `<span>${Math.round((done / course.totalLessons) * 100)}% done</span>` : ''}
            </div>
            <div class="welcome-actions rise rise-d3">
              ${firstLesson ? `<button class="btn-primary" onclick="openLesson(flatLessons.find(l=>l.hasContent))">Start from the beginning →</button>` : ''}
              <button class="btn-ghost" onclick="showDashboard()">← Back to library</button>
            </div>
            <div class="welcome-shortcuts rise rise-d4">
              <span><b>⌘←</b>/<b>⌘→</b> navigate</span>
              <span><b>⌘K</b> search</span>
              <span><b>⌘D</b> theme</span>
              <span><b>⌘</b><b>0</b> done</span>
            </div>
          </div>
        `;
      }

      updateBreadcrumb(course.label);
      updateProgress();
    }

    // ─── Lesson Opening ───
    function openLessonByPath(courseKey, path, title) {
      const course = courses.find(c => c.key === courseKey);
      if (!course) return;

      if (currentCourse?.key !== courseKey) {
        currentCourse = course;
        flatLessons = flatLessonsForCourse(course);
      }

      const lesson = flatLessons.find(l => l.path === path);
      if (lesson) openLesson(lesson);
    }

    function openLesson(lesson) {
      currentLesson = lesson;
      currentIndex = flatLessons.findIndex(l => l.path === lesson.path);

      const frame = document.getElementById('lessonFrame');
      const loading = document.getElementById('loading');

      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('welcome').style.display = 'none';
      frame.style.display = 'block';
      document.getElementById('lessonNav').style.display = 'flex';
      loading.classList.remove('hidden');

      const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      frame.src = `/api/lesson/${lesson.courseKey}/${lesson.path}/${lesson.folderName}.html?theme=${theme}`;
      frame.onload = () => {
        loading.classList.add('hidden');
        try {
          frame.contentDocument.documentElement.className = theme;
        } catch(e) {}
        setupReader(lesson);
      };

      // Sidebar: follow the lesson (switch course, open its chapter, highlight the row)
      navCourseKey = lesson.courseKey;
      try { localStorage.setItem('navCourse', navCourseKey); } catch {}
      renderNav({ reveal: true });

      updateBreadcrumb(currentCourse.label, lesson.categoryName, lesson.title);
      updateNavButtons();
      updateProgress();

      // Persist for "continue where you left off"
      state.lastOpened[lesson.courseKey] = { path: lesson.path, title: lesson.title, index: currentIndex, at: Date.now() };
      lastOpened = latestOpened();
      post('/api/state/last', { course: lesson.courseKey, path: lesson.path, title: lesson.title, index: currentIndex });

      window.location.hash = encodeURIComponent(JSON.stringify({ course: lesson.courseKey, lesson: lesson.path }));

      loadCodeFiles(lesson);
    }

    function navigateLesson(dir) {
      const nextIdx = currentIndex + dir;
      if (nextIdx >= 0 && nextIdx < flatLessons.length) {
        openLesson(flatLessons[nextIdx]);
      }
    }

    function markComplete() {
      if (!currentLesson) return;
      const { courseKey, path } = currentLesson;
      const nowDone = !isDone(courseKey, path);
      if (nowDone) state.completed[doneKey(courseKey, path)] = Date.now();
      else delete state.completed[doneKey(courseKey, path)];
      post('/api/state/complete', { course: courseKey, path, done: nowDone });

      renderNav();
      updateProgress();

      // Marking done moves on; un-marking stays put.
      if (nowDone && currentIndex < flatLessons.length - 1) {
        setTimeout(() => navigateLesson(1), 250);
      }
    }

    // ─── Reader aids: scroll memory + outline ───
    let outlineHeads = [];

    function escapeHtml(t) {
      return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function setupReader(lesson) {
      let doc;
      try { doc = document.getElementById('lessonFrame').contentDocument; } catch { return; }
      if (!doc || !doc.documentElement) return;

      buildOutline(doc);

      const key = doneKey(lesson.courseKey, lesson.path);
      const scroller = doc.scrollingElement || doc.documentElement;
      const saved = state.scroll[key];
      const restore = () => {
        const max = scroller.scrollHeight - scroller.clientHeight;
        if (saved && max > 0) scroller.scrollTop = saved * max;
      };
      if (saved) { requestAnimationFrame(restore); setTimeout(restore, 250); }   // again once images settle

      let timer;
      doc.addEventListener('scroll', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const max = scroller.scrollHeight - scroller.clientHeight;
          if (max <= 0) return;
          const ratio = scroller.scrollTop / max;
          if (ratio < 0.02 || ratio > 0.98) delete state.scroll[key]; else state.scroll[key] = ratio;
          post('/api/state/scroll', { course: lesson.courseKey, path: lesson.path, ratio });
        }, 500);
      }, { passive: true });
    }

    function buildOutline(doc) {
      outlineHeads = [...doc.querySelectorAll('h2, h3')].filter(h => h.textContent.replace(/#\s*$/, '').trim());
      const list = document.getElementById('outlineList');
      list.innerHTML = outlineHeads.length
        ? outlineHeads.map((h, i) =>
            `<button class="ol-item ol-${h.tagName.toLowerCase()}" onclick="gotoHeading(${i})">${escapeHtml(h.textContent.replace(/#\s*$/, '').trim())}</button>`
          ).join('')
        : '<div class="ol-empty">No headings in this lesson</div>';
      document.getElementById('outlineBtn').style.display = outlineHeads.length ? '' : 'none';
      closeOutline();
    }

    function gotoHeading(i) {
      const h = outlineHeads[i];
      if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      closeOutline();
    }
    function toggleOutline() { document.getElementById('outline').classList.toggle('open'); }
    function closeOutline() { document.getElementById('outline').classList.remove('open'); }

    // ─── Today's plan ───
    function lessonMinutes(l) { return l.minutes || DEFAULT_MINUTES; }

    function minutesDoneToday() {
      const d = new Date(); d.setHours(0, 0, 0, 0);
      const flat = {};
      let total = 0;
      for (const [k, ts] of Object.entries(state.completed)) {
        if (ts < d.getTime()) continue;
        const i = k.indexOf(':');
        const courseKey = k.slice(0, i), path = k.slice(i + 1);
        const course = courses.find(c => c.key === courseKey);
        if (!course) continue;
        flat[courseKey] = flat[courseKey] || flatLessonsForCourse(course);
        const l = flat[courseKey].find(x => x.path === path);
        if (l) total += lessonMinutes(l);
      }
      return total;
    }

    function buildTodayPlan() {
      const daily = state.settings.dailyMinutes;
      const doneToday = minutesDoneToday();
      const remaining = Math.max(0, daily - doneToday);
      const weights = Object.entries(state.settings.weights)
        .filter(([k]) => courses.some(c => c.key === k))
        .sort((a, b) => b[1] - a[1]);
      const sum = weights.reduce((a, [, w]) => a + w, 0) || 1;
      const items = [];
      for (const [key, w] of weights) {
        const course = courses.find(c => c.key === key);
        let budget = remaining * w / sum;
        for (const l of flatLessonsForCourse(course)) {
          if (budget <= 0) break;
          if (!l.hasContent || isDone(key, l.path)) continue;
          items.push({ course, lesson: l, minutes: lessonMinutes(l) });
          budget -= lessonMinutes(l);
        }
      }
      return { daily, doneToday, remaining, items };
    }

    function renderToday() {
      const { daily, doneToday, remaining, items } = buildTodayPlan();
      const pct = Math.min(100, Math.round(doneToday / daily * 100));
      const planned = items.reduce((a, i) => a + i.minutes, 0);
      return `
        <section class="today rise rise-d1">
          <div class="today-head">
            <h2>Today</h2>
            <span class="goal">${doneToday} / <input type="number" min="15" max="600" step="15" value="${daily}" onchange="setDailyMinutes(this.value)" aria-label="Daily minutes"> min</span>
            ${remaining > 0 ? `<span class="goal">${planned} min planned</span>` : ''}
          </div>
          <div class="today-bar"><span style="width:${pct}%"></span></div>
          ${remaining === 0
            ? '<div class="today-done">Daily goal reached. Anything more is a bonus.</div>'
            : items.map(it => `
              <button class="today-item" style="--hue:${courseHue(it.course)}"
                      onclick="openSearchResult('${it.course.key}', '${escapeAttr(it.lesson.path)}')">
                <span class="tag">${courseTag(it.course)}</span>
                <span class="ttl">${escapeHtml(it.lesson.title)}</span>
                <span class="sub">${escapeHtml(it.lesson.categoryName || '')} · ~${it.minutes} min</span>
              </button>`).join('')}
        </section>`;
    }

    async function setDailyMinutes(v) {
      const n = Math.round(Number(v));
      if (!Number.isFinite(n)) return;
      const r = await (await fetch('/api/state/settings', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dailyMinutes: n })
      })).json();
      state.settings = r.settings;
      renderDashboard();
    }

    // ─── Code Panel ───
    async function loadCodeFiles(lesson) {
      if (!lesson.hasCodes) {
        document.getElementById('codePre').textContent = 'No code files for this lesson.';
        document.getElementById('codeTabs').innerHTML = '';
        return;
      }

      try {
        const codeDir = `${lesson.path}/Codes_1`;
        let filesToTry = [
          { name: 'Solution', path: `${codeDir}/Solution.txt` },
          { name: 'Main', path: `${codeDir}/javascriptmain.txt` },
          { name: 'JavaScript', path: `${codeDir}/javascriptindex js.txt` },
          { name: 'Python', path: `${codeDir}/pythonmain py.txt` },
          { name: 'Java', path: `${codeDir}/javamain java.txt` },
          { name: 'C++', path: `${codeDir}/cplusplusmain cpp.txt` },
          { name: 'C#', path: `${codeDir}/cmain cs.txt` },
          { name: 'Tests', path: `${codeDir}/PublicTestCases.txt` }
        ];

        if (lesson.codeCount && lesson.codeCount > 1) {
          for (let i = 1; i <= Math.min(lesson.codeCount, 9); i++) {
            const dir = `${lesson.path}/Codes_${i}`;
            filesToTry.push(
              { name: `Code ${i} (Java)`, path: `${dir}/javamain java.txt` },
              { name: `Code ${i} (Python)`, path: `${dir}/pythonmain py.txt` },
              { name: `Code ${i} (JS)`, path: `${dir}/javascriptindex js.txt` },
              { name: `Code ${i} (C++)`, path: `${dir}/cplusplusmain cpp.txt` },
              { name: `Code ${i} (C#)`, path: `${dir}/cmain cs.txt` }
            );
          }
        }

        const loadedFiles = [];
        for (const f of filesToTry) {
          try {
            const res = await fetch(`/api/asset/${lesson.courseKey}/${encodeURI(f.path)}`);
            if (res.ok) {
              const text = await res.text();
              if (text.trim().length > 0) {
                loadedFiles.push({ name: f.name, content: text });
              }
            }
          } catch {}
        }

        renderCodeTabs(loadedFiles);
      } catch (e) {
        document.getElementById('codePre').textContent = 'Error loading code files.';
      }
    }

    function renderCodeTabs(files) {
      const tabs = document.getElementById('codeTabs');
      if (files.length === 0) {
        tabs.innerHTML = '';
        document.getElementById('codePre').textContent = 'No code files found.';
        return;
      }

      tabs.innerHTML = files.map((f, i) =>
        `<div class="code-tab ${i === 0 ? 'active' : ''}" onclick="showCodeTab(${i})" data-idx="${i}">${f.name}</div>`
      ).join('');

      window._codeFiles = files;
      showCodeTab(0);
    }

    function showCodeTab(idx) {
      document.querySelectorAll('.code-tab').forEach(t => t.classList.toggle('active', parseInt(t.dataset.idx) === idx));
      const file = window._codeFiles?.[idx];
      if (file) {
        document.getElementById('codePre').textContent = file.content;
      }
    }

    function toggleCodePanel() {
      document.getElementById('codePanel').classList.toggle('open');
    }

    // ─── UI Helpers ───
    function updateBreadcrumb(...parts) {
      const bc = document.getElementById('breadcrumb');
      let html = `<span class="crumb" onclick="showDashboard()">Home</span>`;
      parts.forEach((part, i) => {
        html += `<span class="breadcrumb-sep">›</span>`;
        if (i === parts.length - 1) {
          html += `<span class="breadcrumb-current">${part}</span>`;
        } else {
          html += `<span class="crumb">${part}</span>`;
        }
      });
      bc.innerHTML = html;
    }

    function updateNavButtons() {
      document.getElementById('prevBtn').disabled = currentIndex <= 0;
      document.getElementById('nextBtn').disabled = currentIndex >= flatLessons.length - 1;
    }

    function updateProgress() {
      const badge = document.getElementById('progressBadge');
      if (currentCourse) {
        const courseLessons = flatLessonsForCourse(currentCourse);
        const done = courseLessons.filter(l => isDone(currentCourse.key, l.path)).length;
        const pct = courseLessons.length > 0 ? Math.round((done / courseLessons.length) * 100) : 0;
        badge.textContent = `${done}/${courseLessons.length} · ${pct}%`;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    }

    function showDashboard() {
      currentCourse = null;
      currentLesson = null;
      flatLessons = [];
      currentIndex = -1;

      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('lessonFrame').style.display = 'none';
      document.getElementById('lessonNav').style.display = 'none';
      document.getElementById('codePanel').classList.remove('open');

      renderNav();
      updateBreadcrumb();
      updateProgress();

      renderDashboard();
      window.location.hash = '';
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 820) {
        sidebar.classList.toggle('open');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);

      const icon = document.getElementById('themeIcon');
      if (next === 'light') {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      } else {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
      }

      try {
        const frame = document.getElementById('lessonFrame');
        if (frame.contentDocument) {
          frame.contentDocument.documentElement.className = next === 'dark' ? 'dark' : 'light';
        }
      } catch {}
    }

    // ─── Search ───
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function() {
      clearTimeout(searchTimeout);
      const q = this.value.trim();
      const results = document.getElementById('searchResults');

      if (!q) {
        results.classList.remove('active');
        return;
      }

      searchTimeout = setTimeout(async () => {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        if (data.length === 0) {
          results.innerHTML = '<div style="padding:11px 12px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)">No results found</div>';
        } else {
          results.innerHTML = data.map(r =>
            `<div class="search-result-item" onclick="openSearchResult('${r.courseKey}', '${escapeAttr(r.path)}')">
              <div class="sr-course">${(COURSE_TAGS[r.courseKey] || '')} · ${r.course}</div>
              <div class="sr-title">${r.title}</div>
            </div>`
          ).join('');
        }
        results.classList.add('active');
      }, 200);
    });

    document.getElementById('searchInput').addEventListener('blur', () => {
      setTimeout(() => document.getElementById('searchResults').classList.remove('active'), 200);
    });

    function openSearchResult(courseKey, path) {
      const course = courses.find(c => c.key === courseKey);
      if (!course) return;
      const lessons = flatLessonsForCourse(course);
      const lesson = lessons.find(l => l.path === path);
      if (lesson) {
        selectCourse(course, false);
        setTimeout(() => openLesson(lesson), 100);
      }
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').classList.remove('active');
    }

    // ─── Keyboard Shortcuts ───
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('collapsed') || (window.innerWidth <= 820 && !sidebar.classList.contains('open'))) {
          sidebar.classList.remove('collapsed');
          sidebar.classList.add('open');
        }
      }

      if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
        e.preventDefault();
        toggleTheme();
      }

      if ((e.ctrlKey || e.metaKey) && e.key === '0') {
        e.preventDefault();
        markComplete();
      }

      if (e.key === 'Escape') closeOutline();
      if (e.key === 'o' && !e.ctrlKey && !e.metaKey && !e.altKey &&
          !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) && currentLesson) {
        toggleOutline();
      }

      if (document.activeElement.tagName !== 'INPUT') {
        if (e.key === 'ArrowLeft' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          navigateLesson(-1);
        }
        if (e.key === 'ArrowRight' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          navigateLesson(1);
        }
      }
    });

    // ─── Initialize ───
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    init();
  </script>
</body>
</html>
